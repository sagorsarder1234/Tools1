<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="cyber-m-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141829" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#07090f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020306" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyber-m-line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020306" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="48%" stop-color="#f1f5f9" stop-opacity="1"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020306" stop-opacity="0"/>
    </linearGradient>
    <filter id="cyber-m-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="#020306"/>
  <rect width="1080" height="1920" fill="url(#cyber-m-bg)"/>
  
  <ellipse cx="540" cy="960" rx="260" ry="500" fill="#3730a3" opacity="0.14" filter="blur(70px)"/>
  
  <!-- S Shadow Rib -->
  <path d="M 600 280 C 440 640, 360 820, 520 980 C 680 1140, 680 1340, 480 1640" 
        fill="none" stroke="#1e1b4b" stroke-width="48" opacity="0.45" filter="blur(25px)"/>
        
  <!-- S Dark Body -->
  <path d="M 600 280 C 440 640, 360 820, 520 980 C 680 1140, 680 1340, 480 1640" 
        fill="none" stroke="#0b0f19" stroke-width="16" opacity="0.85"/>
        
  <!-- S Glowing Line -->
  <path d="M 600 280 C 440 640, 360 820, 520 980 C 680 1140, 680 1340, 480 1640" 
        fill="none" stroke="url(#cyber-m-line)" stroke-width="5" stroke-linecap="round" filter="url(#cyber-m-glow)"/>
</svg>
