<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="red-m-bg" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2c080d" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090406" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030102" stop-opacity="1"/>
    </radialGradient>
    <filter id="neon-red-m-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="blade-m-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff1e38" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1920" fill="#040203"/>
  <rect width="1080" height="1920" fill="url(#red-m-bg)"/>
  
  <circle cx="700" cy="1100" r="350" fill="#dc2626" opacity="0.14" filter="blur(90px)"/>
  
  <!-- Sweeping Layer 1 (Upper Curve) -->
  <path d="M -50 800 Q 400 350, 1150 100" fill="none" stroke="url(#blade-m-1)" stroke-width="4.5" filter="url(#neon-red-m-glow)"/>
  
  <!-- Sweeping Layer 2 (Diagonal Blade Across Middle) -->
  <path d="M -80 1350 Q 550 850, 1150 450" fill="none" stroke="url(#blade-m-1)" stroke-width="5" filter="url(#neon-red-m-glow)"/>
  
  <!-- Sweeping Layer 3 (Lower Blade Sweep) -->
  <path d="M 250 1950 Q 750 1500, 1120 1100" fill="none" stroke="url(#blade-m-1)" stroke-width="4" filter="url(#neon-red-m-glow)"/>
  <path d="M 500 2000 Q 850 1700, 1100 1450" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0.6" filter="url(#neon-red-m-glow)"/>
</svg>
