<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="cyber-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141829" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#080a10" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030407" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#e0e7ff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </linearGradient>
    <filter id="cyber-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="#030407"/>
  <rect width="1920" height="1080" fill="url(#cyber-bg-glow)"/>
  
  <!-- Subtle center ambient aura -->
  <ellipse cx="960" cy="540" rx="350" ry="480" fill="#4338ca" opacity="0.12" filter="blur(80px)"/>
  
  <!-- S Ribbon Soft Shadow Backing -->
  <path d="M 1040 100 C 940 320, 840 440, 930 540 C 1020 640, 1050 780, 920 980" 
        fill="none" stroke="#1e1b4b" stroke-width="38" opacity="0.4" filter="blur(20px)"/>
  
  <!-- S Ribbon Sleek Body -->
  <path d="M 1040 100 C 940 320, 840 440, 930 540 C 1020 640, 1050 780, 920 980" 
        fill="none" stroke="#0f172a" stroke-width="14" opacity="0.8"/>
        
  <!-- Glowing Luminescent S Edge Line -->
  <path d="M 1040 100 C 940 320, 840 440, 930 540 C 1020 640, 1050 780, 920 980" 
        fill="none" stroke="url(#cyber-line-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#cyber-glow)"/>
</svg>
